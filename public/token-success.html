<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Saved</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            padding: 40px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 10px;
        }

        a {

        <h1>Card Saved Successfully</h1>

        </p>

</html>
